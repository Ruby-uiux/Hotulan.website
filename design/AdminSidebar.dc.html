<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Админ — Хажуу цэс</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#334155;text-decoration:none}a:hover{color:#0000ff}
</style>
</helmet>
<aside aria-label="Админ цэс" style="width: 100%; min-height: 1000px; height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e2e8f0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column">
  <div style="height: 72px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e2e8f0">
    <span style="width: 36px; height: 36px; border-radius: 9px; background: #0000ff; color: #ffffff; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9 4.5 4h15L21 9M3 9h18M3 9v11h18V9M9 20v-6h6v6"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 1.2">
      <span style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em">hotulan<span style="color: #0000ff">.mn</span></span>
      <span style="font-size: 12px; color: #64748b">Админ самбар</span>
    </span>
  </div>
  <nav style="flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 0 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b">{{g.t}}</span>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
          <a href="{{it.href}}" aria-current="{{it.current}}" style="height: 42px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: {{it.weight}}; background: {{it.bg}}; color: {{it.fg}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
            <span style="flex: 1">{{it.t}}</span>
            <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}">
              <span style="min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{it.badgeBg}}; color: #ffffff; font-size: 11px; font-weight: 700; display: grid; place-items: center">{{it.badge}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <div style="padding: 16px; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px">
    <span style="width: 36px; height: 36px; border-radius: 999px; background: #0f172a; color: #ffffff; display: grid; place-items: center; font-size: 13px; font-weight: 700">ЗА</span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">Загдаа</span>
      <span style="font-size: 12px; color: #64748b">Супер админ</span>
    </span>
    <a href="#" aria-label="Гарах" style="width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #64748b">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
    </a>
  </div>
</aside>
</x-dc>

</html>
