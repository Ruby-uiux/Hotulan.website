<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Mobile — Админ самбар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000ff;text-decoration:none}a:hover{color:#0000c2}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column">
  <header style="background: #ffffff; padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e2e8f0">
    <a href="MAdminMenu.dc.html" aria-label="Цэс нээх" style="width: 44px; height: 44px; display: grid; place-items: center; color: #0f172a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 700">Хяналтын самбар</h1>
    <button type="button" aria-label="Мэдэгдэл, 4 шинэ" style="width: 44px; height: 44px; border: 0; background: none; color: #0f172a; display: grid; place-items: center; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 999px; background: #dc2626"></span></button>
  </header>
  <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #64748b">{{k.t}}</span><span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">{{k.v}}</span><span style="font-size: 12px; font-weight: 600; color: {{k.c}}">{{k.d}}</span></div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="AdminProductForm.dc.html" style="height: 72px; border-radius: 12px; background: #0000ff; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span style="font-size: 20px">+</span>Бараа</a>
      <a href="MAdminOrders.dc.html" style="height: 72px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span style="font-size: 18px; font-weight: 800; color: #0000ff">5</span>Шинэ захиалга</a>
      <a href="AdminAppearance.dc.html" style="height: 72px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600"><span style="font-size: 18px">▣</span>Баннер</a>
    </div>
    <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Борлуулалт · 14 хоног</h2><b style="font-size: 14px">48.6 сая₮</b></div>
      <div role="img" aria-label="Борлуулалтын багана график" style="height: 120px; display: flex; align-items: flex-end; gap: 5px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><span style="flex: 1; height: {{b.h}}; border-radius: 3px 3px 0 0; background: {{b.c}}"></span></sc-for>
      </div>
    </section>
    <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden">
      <div style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0"><h2 style="margin: 0; font-size: 15px; font-weight: 700">Сүүлийн захиалга</h2><a href="MAdminOrders.dc.html" style="font-size: 13px; font-weight: 600; padding: 8px 0">Бүгд</a></div>
      <sc-for list="{{recent}}" as="o" hint-placeholder-count="4">
        <a href="MAdminOrderDetail.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid #f1f5f9; color: #0f172a">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px">{{o.id}}</b><span style="font-size: 12px; color: #64748b">{{o.c}} · {{o.d}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b style="font-size: 14px">{{o.a}}</b><span style="padding: 2px 8px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-size: 11px; font-weight: 600">{{o.s}}</span></span>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    var vals = [2.1, 2.8, 2.4, 3.6, 4.2, 3.1, 2.7, 3.3, 3.9, 4.8, 3.5, 2.9, 3.8, 4.4];
    var S = { new: ['Шинэ', '#eef0ff', '#0000c2'], paid: ['Төлөгдсөн', '#e0f2fe', '#075985'], packing: ['Савлаж байна', '#fef3c7', '#92400e'], ship: ['Хүргэлтэнд', '#ede9fe', '#5b21b6'] };
    function O(id, c, d, a, s) { return { id: id, c: c, d: d, a: a, s: S[s][0], bg: S[s][1], fg: S[s][2] }; }
    return {
      kpis: [
        { t: 'Өнөөдрийн борлуулалт', v: '4.42 сая₮', d: '▲ 12%', c: '#15803d' }, { t: 'Шинэ захиалга', v: '18', d: '5 төлбөр хүлээж буй', c: '#475569' },
        { t: 'Дундаж захиалга', v: '245,600₮', d: '▲ 4%', c: '#15803d' }, { t: 'Дуусаж буй бараа', v: '3', d: 'Нөхөх шаардлагатай', c: '#b91c1c' }
      ],
      bars: vals.map(function (v, i) { return { h: Math.round(v / 5 * 100) + '%', c: i === vals.length - 1 ? '#0000ff' : '#a5acff' }; }),
      recent: [O('HTL-482913', 'Б. Сарангэрэл', 'Хан-Уул', '537,000₮', 'new'), O('HTL-482910', 'Д. Тэмүүлэн', 'Баянзүрх', '1,290,000₮', 'paid'), O('HTL-482905', 'Г. Номин', 'Сүхбаатар', '189,000₮', 'packing'), O('HTL-482899', 'Э. Билгүүн', 'Баянгол', '2,190,000₮', 'ship')]
    };
  }
}
</script>
</body>
</html>
