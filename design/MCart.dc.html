<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Mobile — Сагс</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000ff;text-decoration:none}a:hover{color:#0000c2}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; position: relative">
  <header style="background: #ffffff; padding: 8px 16px 8px 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e2e8f0">
    <a href="MHome.dc.html" aria-label="Буцах" style="width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; color: #0f172a">←</a>
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 700">Сагс (3)</h1>
    <button type="button" style="height: 44px; border: 0; background: none; color: #b91c1c; font: 600 14px Inter, sans-serif">Хоослох</button>
  </header>
  <main style="padding: 16px 16px 160px; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 12px; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; font-size: 13px; color: #166534; display: flex; flex-direction: column; gap: 8px"><b>Хүргэлт үнэгүй боллоо</b><span style="height: 6px; border-radius: 3px; background: #15803d"></span></div>
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
      <article style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; gap: 12px">
        <span style="width: 84px; height: 84px; flex: none; border-radius: 10px; background: {{l.tint}}"></span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; gap: 8px"><span style="flex: 1; font-size: 14px; font-weight: 600; line-height: 1.35">{{l.t}}</span><button type="button" aria-label="Хасах" style="width: 32px; height: 32px; border: 0; background: none; color: #64748b; font-size: 14px">✕</button></span>
          <span style="font-size: 12px; color: #64748b">{{l.v}}</span>
          <span style="display: flex; justify-content: space-between; align-items: center; margin-top: auto">
            <span style="font-size: 15px; font-weight: 800">{{l.p}}</span>
            <span style="display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 8px; height: 36px"><button type="button" aria-label="Хасах" style="width: 36px; height: 34px; border: 0; background: none; font-size: 16px; color: #0f172a">−</button><span style="width: 24px; text-align: center; font-weight: 700; font-size: 14px">1</span><button type="button" aria-label="Нэмэх" style="width: 36px; height: 34px; border: 0; background: none; font-size: 16px; color: #0f172a">+</button></span>
          </span>
        </div>
      </article>
    </sc-for>
    <div style="display: flex; gap: 8px"><label for="mc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Купон</label><input id="mc" type="text" placeholder="Купон код" style="flex: 1; min-width: 0; height: 46px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 12px; font: 400 15px Inter, sans-serif"><button type="button" style="height: 46px; padding: 0 16px; border: 0; border-radius: 8px; background: #0f172a; color: #ffffff; font: 600 14px Inter, sans-serif">Ашиглах</button></div>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e2e8f0; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #475569"><span>Барааны дүн</span><span>557,000₮</span></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 16px">Нийт</b><b style="font-size: 22px">557,000₮</b></div>
    <a href="MCheckout.dc.html" style="height: 52px; border-radius: 10px; background: #0000ff; color: #ffffff; display: grid; place-items: center; font-weight: 700; font-size: 15px">Захиалах</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { t: 'Утасгүй чихэвч, ANC', v: 'Өнгө: Хар', p: '459,000₮', tint: '#eef0ff' },
        { t: 'Зөөлөн баавгай, 60 см', v: 'Өнгө: Цайвар', p: '59,000₮', tint: '#fce7f3' },
        { t: 'Чихэвчний хатуу хайрцаг', v: '—', p: '39,000₮', tint: '#f1f5f9' }
      ]
    };
  }
}
</script>
</body>
</html>
