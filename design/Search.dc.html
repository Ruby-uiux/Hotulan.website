<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Хайлтын үр дүн — чихэвч</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f172a;text-decoration:none}a:hover{color:#0000ff}
</style>
</helmet>
<div style="width: 100%; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a">
  <dc-import name="StoreHeader" hint-size="100%,180px"></dc-import>
  <main style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">“чихэвч” <span style="font-weight: 500; color: #64748b; font-size: 18px">— 38 илэрц</span></h1>
      <span style="font-size: 14px; color: #475569">Та “<a href="#" style="color: #0000ff; font-weight: 600">утасгүй чихэвч</a>” гэж хайсан уу?</span>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{facets}}" as="f" hint-placeholder-count="5">
        <a href="#" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500">{{f.t}} <span style="opacity: 0.7">{{f.n}}</span></a>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 14px; color: #475569">
      <span>Бэлэн байгаа · Улаанбаатарт маргааш хүргэнэ</span>
      <label style="display: flex; gap: 8px; align-items: center">Эрэмбэлэх<select style="height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font: 500 14px Inter, sans-serif; background: #ffffff; color: #0f172a"><option>Хамгийн тохирох</option></select></label>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="10">
        <article style="border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #ffffff">
          <a href="Product.dc.html" aria-label="{{p.t}}" style="aspect-ratio: 1 / 1; background: {{p.tint}}; display: block"></a>
          <div style="padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1">
            <span style="font-size: 12px; color: #64748b">{{p.b}}</span>
            <a href="Product.dc.html" style="font-size: 14px; font-weight: 600; line-height: 1.4; min-height: 39px">{{p.t}}</a>
            <span style="font-size: 17px; font-weight: 800; margin-top: auto">{{p.p}}</span>
            <button type="button" style="height: 40px; border: 0; border-radius: 8px; background: #0000ff; color: #ffffff; font: 600 14px Inter, sans-serif">Сагсанд нэмэх</button>
          </div>
        </article>
      </sc-for>
    </div>
    <button type="button" style="align-self: center; height: 48px; padding: 0 28px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font: 600 14px Inter, sans-serif">Дараагийн 20-ыг харах (10 / 38)</button>
  </main>
  <dc-import name="StoreFooter" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    var tints = ['#eef0ff', '#f1f5f9', '#fef3c7', '#dcfce7', '#fce7f3'];
    var raw = [['Утасгүй чихэвч, ANC', 'Sony', '459,000₮'], ['Чихэнд суудаг чихэвч', 'Xiaomi', '89,000₮'], ['Спортын чихэвч, IPX5', 'JBL', '159,000₮'], ['Хүүхдийн чихэвч, 85dB хязгаар', 'Kidz', '69,000₮'], ['Тоглоомын чихэвч, микрофонтой', 'HyperX', '249,000₮'],
      ['Ясны дамжуулалттай чихэвч', 'Shokz', '389,000₮'], ['Утастай чихэвч, 3.5мм', 'Sony', '39,000₮'], ['Студийн чихэвч', 'Audio-Technica', '529,000₮'], ['Чихэвчний хайрцаг', 'Generic', '39,000₮'], ['Чихэвчний дэр, солих', 'Generic', '19,000₮']];
    var facets = [['Бүгд', 38], ['Цахилгаан бараа', 31], ['Спорт', 4], ['Хүүхдийн', 2], ['Дагалдах хэрэгсэл', 6]];
    return {
      items: raw.map(function (r, i) { return { t: r[0], b: r[1], p: r[2], tint: tints[i % 5] }; }),
      facets: facets.map(function (f, i) { return { t: f[0], n: f[1], bg: i ? '#ffffff' : '#0f172a', fg: i ? '#0f172a' : '#ffffff', bd: i ? '#cbd5e1' : '#0f172a' }; })
    };
  }
}
</script>
</body>
</html>
