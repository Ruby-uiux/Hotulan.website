<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Mobile — Захиалгын дэлгэрэнгүй</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000ff;text-decoration:none}a:hover{color:#0000c2}
</style>
</helmet>
<div style="width: 390px; min-height: 1400px; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; display: flex; flex-direction: column; position: relative">
  <header style="background: #ffffff; padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #e2e8f0">
    <a href="MAdminOrders.dc.html" aria-label="Буцах" style="width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; color: #0f172a">←</a>
    <span style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 16px; font-weight: 700">HTL-482913</h1><span style="font-size: 12px; color: #64748b">11.17 · 14:32</span></span>
    <button type="button" aria-label="Цааш үйлдэл" style="width: 44px; height: 44px; border: 0; background: none; color: #0f172a; font-size: 20px">⋯</button>
  </header>
  <main style="padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 6px"><span style="padding: 4px 10px; border-radius: 999px; background: #eef0ff; color: #0000c2; font-size: 12px; font-weight: 600">Шинэ</span><span style="padding: 4px 10px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 600">Төлбөр хүлээгдэж буй</span></div>
    <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 15px">Б. Сарангэрэл</b><a href="tel:99112345" style="height: 40px; padding: 0 14px; border-radius: 8px; background: #eef0ff; color: #0000c2; display: flex; align-items: center; font-weight: 600; font-size: 13px">Залгах</a></div>
      <span style="font-size: 14px; color: #475569; line-height: 1.6">Хан-Уул, 15-р хороо, Зайсан, 52-р байр, 2 орц, 41 тоот</span>
      <span style="font-size: 13px; padding: 8px 10px; border-radius: 8px; background: #f8fafc; color: #475569">Орцны код 41#, ирэхээс өмнө залгана уу</span>
      <span style="font-size: 13px">Цаг: <b>11.18 · 10:00–14:00</b></span>
    </section>
    <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f1f5f9"><span style="width: 44px; height: 44px; border-radius: 8px; background: {{l.tint}}; flex: none"></span><span style="flex: 1; display: flex; flex-direction: column; font-size: 13px"><b>{{l.t}}</b><span style="color: #64748b">× {{l.q}}</span></span><b style="font-size: 14px">{{l.p}}</b></div>
      </sc-for>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
        <div style="display: flex; justify-content: space-between; color: #475569"><span>Купон WINTER20</span><span style="color: #dc2626">−20,000₮</span></div>
        <div style="display: flex; justify-content: space-between; color: #475569"><span>Хүргэлт</span><span style="color: #15803d">Үнэгүй</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; padding-top: 4px"><span>Нийт</span><span>537,000₮</span></div>
      </div>
    </section>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Жолооч<select style="height: 48px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font: 400 16px Inter, sans-serif; background: #ffffff; color: #0f172a"><option>— Сонгох —</option><option>Батбаяр</option><option>Ганзориг</option></select></label>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e2e8f0; padding: 12px 16px 20px; display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 50px; border: 1px solid #fecaca; border-radius: 10px; background: #ffffff; color: #b91c1c; font: 600 14px Inter, sans-serif">Цуцлах</button>
    <button type="button" style="flex: 2; height: 50px; border: 0; border-radius: 10px; background: #0000ff; color: #ffffff; font: 700 14px Inter, sans-serif">Төлөгдсөн болгох</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { t: 'Утасгүй чихэвч, ANC — Хар', q: 1, p: '459,000₮', tint: '#eef0ff' },
        { t: 'Зөөлөн баавгай, 60 см', q: 1, p: '59,000₮', tint: '#fce7f3' },
        { t: 'Чихэвчний хатуу хайрцаг', q: 1, p: '39,000₮', tint: '#f1f5f9' }
      ]
    };
  }
}
</script>
</body>
</html>
