<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Миний захиалга</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000ff;text-decoration:none}a:hover{color:#0000c2}
</style>
</helmet>
<div style="width: 100%; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a">
  <dc-import name="StoreHeader" hint-size="100%,180px"></dc-import>
  <main style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <nav aria-label="Миний бүртгэл" style="flex: 1 1 220px; max-width: 260px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; gap: 10px; align-items: center; padding: 4px 8px 14px; border-bottom: 1px solid #f1f5f9; margin-bottom: 8px"><span style="width: 40px; height: 40px; border-radius: 999px; background: #eef0ff; color: #0000c2; display: grid; place-items: center; font-weight: 700">БС</span><span style="display: flex; flex-direction: column; font-size: 14px"><b>Б. Сарангэрэл</b><span style="color: #64748b; font-size: 13px">9911-2345</span></span></div>
      <a href="MyOrders.dc.html" aria-current="page" style="height: 42px; padding: 0 12px; border-radius: 8px; background: #eef0ff; color: #0000c2; display: flex; align-items: center; font-size: 14px; font-weight: 700">Миний захиалга</a>
      <a href="#" style="height: 42px; padding: 0 12px; border-radius: 8px; color: #334155; display: flex; align-items: center; font-size: 14px">Хадгалсан бараа</a>
      <a href="#" style="height: 42px; padding: 0 12px; border-radius: 8px; color: #334155; display: flex; align-items: center; font-size: 14px">Хүргэлтийн хаяг</a>
      <a href="#" style="height: 42px; padding: 0 12px; border-radius: 8px; color: #334155; display: flex; align-items: center; font-size: 14px">И-баримт</a>
      <a href="#" style="height: 42px; padding: 0 12px; border-radius: 8px; color: #b91c1c; display: flex; align-items: center; font-size: 14px">Гарах</a>
    </nav>
    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Миний захиалга</h1>
      <sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
        <article style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
          <div style="display: flex; gap: 6px">
            <sc-for list="{{o.thumbs}}" as="t" hint-placeholder-count="3"><span style="width: 52px; height: 52px; border-radius: 8px; background: {{t.c}}"></span></sc-for>
          </div>
          <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; gap: 10px; align-items: center"><b style="font-size: 15px">{{o.id}}</b><span style="padding: 3px 10px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-size: 12px; font-weight: 600">{{o.s}}</span></span>
            <span style="font-size: 13px; color: #64748b">{{o.dt}} · {{o.n}} бараа · {{o.a}}</span>
          </div>
          <div style="display: flex; gap: 8px">
            <a href="{{o.href}}" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #cbd5e1; color: #0f172a; display: flex; align-items: center; font-size: 13px; font-weight: 600">{{o.cta}}</a>
            <a href="Checkout.dc.html" style="height: 40px; padding: 0 14px; border-radius: 8px; background: #eef0ff; color: #0000c2; display: flex; align-items: center; font-size: 13px; font-weight: 600">Дахин захиалах</a>
          </div>
        </article>
      </sc-for>
    </section>
  </main>
  <dc-import name="StoreFooter" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var S = { new: ['Төлбөр хүлээгдэж буй', '#fef3c7', '#92400e'], ship: ['Хүргэлтэнд', '#ede9fe', '#5b21b6'], done: ['Хүргэгдсэн', '#dcfce7', '#166534'], back: ['Буцаасан', '#f1f5f9', '#334155'] };
    function O(id, dt, n, a, s, cta, th) { return { id: id, dt: dt, n: n, a: a, s: S[s][0], bg: S[s][1], fg: S[s][2], cta: cta, href: s === 'new' ? 'OrderSuccess.dc.html' : 'TrackOrder.dc.html', thumbs: th.map(function (c) { return { c: c }; }) }; }
    return {
      orders: [
        O('HTL-482913', '2026.11.17', 3, '537,000₮', 'new', 'QPay-ээр төлөх', ['#eef0ff', '#fce7f3', '#f1f5f9']),
        O('HTL-481204', '2026.11.02', 1, '189,000₮', 'ship', 'Хянах', ['#dcfce7']),
        O('HTL-476650', '2026.10.11', 2, '988,000₮', 'done', 'Дэлгэрэнгүй', ['#fef3c7', '#eef0ff']),
        O('HTL-470031', '2026.09.04', 1, '128,000₮', 'back', 'Дэлгэрэнгүй', ['#f1f5f9'])
      ]
    };
  }
}
</script>
</body>
</html>
