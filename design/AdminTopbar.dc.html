<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Админ — Дээд мөр</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f172a;text-decoration:none}a:hover{color:#0000ff}
</style>
</helmet>
<div style="width: 100%; min-height: 72px; box-sizing: border-box; padding: 12px 32px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a">
  <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; min-width: 0">
    <span style="font-size: 12px; color: #64748b">{{crumb}}</span>
    <span style="font-size: 18px; font-weight: 700">{{heading}}</span>
  </div>
  <label style="flex: 0 1 320px; height: 40px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #64748b">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Хайх</span>
    <input type="search" placeholder="Захиалга, бараа, хэрэглэгч хайх…" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 14px Inter, sans-serif; color: #0f172a; outline: none">
    <span style="font-size: 11px; border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 5px; background: #ffffff">Ctrl K</span>
  </label>
  <a href="Home.dc.html" style="height: 40px; padding: 0 14px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
    Сайт үзэх
  </a>
  <button type="button" aria-label="Мэдэгдэл, 4 шинэ" style="width: 44px; height: 44px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; color: #0f172a; display: grid; place-items: center; position: relative">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
    <span style="position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 999px; background: #dc2626; border: 2px solid #ffffff"></span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":"text","default":"Хяналтын самбар"},"crumb":{"editor":"text","default":"Админ"},"$preview":{"width":1192,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    return { heading: this.props.heading ?? 'Хяналтын самбар', crumb: this.props.crumb ?? 'Админ' };
  }
}
</script>
</body>
</html>
