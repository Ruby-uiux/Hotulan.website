<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Нэвтрэх — утасны дугаар ба OTP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0000ff;text-decoration:none}a:hover{color:#0000c2}
</style>
</helmet>
<div style="width: 100%; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a">
  <dc-import name="StoreHeader" hint-size="100%,180px"></dc-import>
  <main style="max-width: 960px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center">
    <section style="flex: 1 1 380px; max-width: 440px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0000ff">Алхам 1 / 2</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Нэвтрэх</h1>
      <p style="margin: 0; font-size: 15px; color: #475569; line-height: 1.6">Нууц үг хэрэггүй. Утсанд тань 6 оронтой код ирнэ.</p>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Утасны дугаар
        <span style="display: flex; height: 50px; border: 1.5px solid #0000ff; box-shadow: 0 0 0 3px #e0e3ff; border-radius: 8px; overflow: hidden; font-weight: 400"><span style="padding: 0 14px; display: flex; align-items: center; background: #f8fafc; border-right: 1px solid #e2e8f0; font-size: 15px">+976</span><input type="tel" value="9911 2345" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font: 500 17px Inter, sans-serif; letter-spacing: 0.04em; outline: none"></span>
      </label>
      <button type="button" style="height: 50px; border: 0; border-radius: 8px; background: #0000ff; color: #ffffff; font: 700 15px Inter, sans-serif">Код авах</button>
      <p style="margin: 0; font-size: 12px; color: #64748b; line-height: 1.6">Үргэлжлүүлснээр <a href="InfoPage.dc.html">үйлчилгээний нөхцөл</a>, <a href="InfoPage.dc.html">нууцлалын бодлого</a>-ыг зөвшөөрнө.</p>
    </section>
    <section style="flex: 1 1 380px; max-width: 440px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0000ff">Алхам 2 / 2</span>
      <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Код оруулах</h2>
      <p style="margin: 0; font-size: 15px; color: #475569; line-height: 1.6"><b style="color: #0f172a">9911-2345</b> дугаарт илгээлээ. <a href="#">Дугаар солих</a></p>
      <fieldset style="border: 0; padding: 0; margin: 0; display: flex; gap: 8px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">6 оронтой код</legend>
        <sc-for list="{{otp}}" as="d" hint-placeholder-count="6">
          <input type="text" inputmode="numeric" maxlength="1" value="{{d.v}}" aria-label="{{d.label}}" style="width: 100%; min-width: 0; height: 56px; border: {{d.bd}}; border-radius: 10px; text-align: center; font: 700 22px Inter, sans-serif; color: #0f172a">
        </sc-for>
      </fieldset>
      <button type="button" style="height: 50px; border: 0; border-radius: 8px; background: #0000ff; color: #ffffff; font: 700 15px Inter, sans-serif">Нэвтрэх</button>
      <span style="font-size: 14px; color: #475569; text-align: center">Код дахин авах <b style="color: #0f172a; font-variant-numeric: tabular-nums">0:42</b></span>
    </section>
  </main>
  <dc-import name="StoreFooter" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var v = ['4', '8', '2', '', '', ''];
    return { otp: v.map(function (x, i) { return { v: x, label: 'Цифр ' + (i + 1), bd: i === 3 ? '2px solid #0000ff' : '1px solid #cbd5e1' }; }) };
  }
}
</script>
</body>
</html>
