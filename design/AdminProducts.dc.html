<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Админ — Бараа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0f172a;text-decoration:none}a:hover{color:#0000ff}
</style>
</helmet>
<div style="width: 100%; min-height: 1150px; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0f172a; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 1 1 248px; min-width: 248px; display: flex">
    <dc-import name="AdminSidebar" active="products" hint-size="100%,100%"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AdminTopbar" heading="Бараа" crumb="Админ · Каталог" hint-size="100%,72px"></dc-import>
    <main style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px">
          <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #0f172a; color: #ffffff; display: flex; align-items: center; font-weight: 600">Бүгд 1,284</span>
          <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #cbd5e1; background: #ffffff; display: flex; align-items: center">Идэвхтэй 1,206</span>
          <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #cbd5e1; background: #ffffff; display: flex; align-items: center">Ноорог 41</span>
          <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; display: flex; align-items: center; font-weight: 600">Дууссан 37</span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font: 600 14px Inter, sans-serif">Excel импорт</button>
          <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #0f172a; font: 600 14px Inter, sans-serif">Экспорт</button>
          <a href="AdminProductForm.dc.html" style="height: 44px; padding: 0 16px; border-radius: 8px; background: #0000ff; color: #ffffff; display: flex; align-items: center; font-size: 14px; font-weight: 600">+ Шинэ бараа</a>
        </div>
      </div>

      <section style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden">
        <div style="padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #e2e8f0">
          <label style="flex: 1 1 260px; height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #64748b">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"></path></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Бараа хайх</span>
            <input type="search" placeholder="Нэр, код, баркодоор хайх" style="flex: 1; min-width: 0; border: 0; font: 400 14px Inter, sans-serif; outline: none">
          </label>
          <select aria-label="Ангилал" style="height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font: 500 14px Inter, sans-serif; background: #ffffff; color: #0f172a"><option>Бүх ангилал (20)</option></select>
          <select aria-label="Брэнд" style="height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font: 500 14px Inter, sans-serif; background: #ffffff; color: #0f172a"><option>Бүх брэнд</option></select>
          <select aria-label="Нөөц" style="height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font: 500 14px Inter, sans-serif; background: #ffffff; color: #0f172a"><option>Нөөц: бүгд</option></select>
        </div>
        <div style="padding: 10px 16px; background: #eef0ff; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px">
          <b style="color: #0000c2">2 бараа сонгосон</b>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c7d2fe; border-radius: 6px; background: #ffffff; color: #0f172a; font: 500 13px Inter, sans-serif">Үнэ өөрчлөх</button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c7d2fe; border-radius: 6px; background: #ffffff; color: #0f172a; font: 500 13px Inter, sans-serif">Ангилал солих</button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c7d2fe; border-radius: 6px; background: #ffffff; color: #0f172a; font: 500 13px Inter, sans-serif">Нуух</button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #fecaca; border-radius: 6px; background: #ffffff; color: #b91c1c; font: 600 13px Inter, sans-serif">Устгах</button>
        </div>
        <div style="overflow-x: auto">
          <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px">
            <thead><tr style="background: #f8fafc; color: #64748b; font-size: 12px; text-align: left">
              <th scope="col" style="padding: 10px 16px; width: 20px"><input type="checkbox" aria-label="Бүгдийг сонгох" style="width: 18px; height: 18px; accent-color: #0000ff"></th>
              <th scope="col" style="padding: 10px 8px; font-weight: 600">Бараа</th>
              <th scope="col" style="padding: 10px 8px; font-weight: 600">Ангилал</th>
              <th scope="col" style="padding: 10px 8px; font-weight: 600">Үнэ</th>
              <th scope="col" style="padding: 10px 8px; font-weight: 600">Нөөц</th>
              <th scope="col" style="padding: 10px 8px; font-weight: 600">Харагдах</th>
              <th scope="col" style="padding: 10px 16px; font-weight: 600; text-align: right">Үйлдэл</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
                <tr style="border-top: 1px solid #f1f5f9; background: {{r.rowBg}}">
                  <td style="padding: 10px 16px"><input type="checkbox" checked="{{r.sel}}" aria-label="Сонгох" style="width: 18px; height: 18px; accent-color: #0000ff"></td>
                  <td style="padding: 10px 8px">
                    <span style="display: flex; align-items: center; gap: 12px">
                      <span style="width: 44px; height: 44px; border-radius: 8px; background: {{r.tint}}; flex: none"></span>
                      <span style="display: flex; flex-direction: column; gap: 2px"><a href="AdminProductForm.dc.html" style="font-weight: 600">{{r.t}}</a><span style="font-size: 12px; color: #64748b">{{r.sku}}</span></span>
                    </span>
                  </td>
                  <td style="padding: 10px 8px; color: #475569">{{r.cat}}</td>
                  <td style="padding: 10px 8px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.p}}</td>
                  <td style="padding: 10px 8px"><span style="font-weight: 600; color: {{r.stockC}}">{{r.stock}}</span></td>
                  <td style="padding: 10px 8px">
                    <button type="button" role="switch" aria-checked="{{r.on}}" aria-label="Сайтад харуулах" style="border: 0; width: 40px; height: 22px; border-radius: 999px; background: {{r.swBg}}; display: flex; align-items: center; padding: 2px; box-sizing: border-box; justify-content: {{r.swJ}}"><span style="width: 18px; height: 18px; border-radius: 999px; background: #ffffff"></span></button>
                  </td>
                  <td style="padding: 10px 16px; text-align: right; white-space: nowrap">
                    <a href="AdminProductForm.dc.html" style="color: #0000ff; font-weight: 600; font-size: 13px; padding: 8px">Засах</a>
                    <a href="#" style="color: #475569; font-size: 13px; padding: 8px">Хуулах</a>
                    <a href="#" style="color: #b91c1c; font-size: 13px; padding: 8px">Устгах</a>
                  </td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <div style="padding: 12px 16px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #64748b; flex-wrap: wrap; gap: 8px">
          <span>1–10 / 1,284 бараа</span>
          <span style="display: flex; gap: 6px">
            <a href="#" style="width: 36px; height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; display: grid; place-items: center">‹</a>
            <a href="#" style="width: 36px; height: 36px; border-radius: 6px; background: #0000ff; color: #ffffff; display: grid; place-items: center; font-weight: 700">1</a>
            <a href="#" style="width: 36px; height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; display: grid; place-items: center">2</a>
            <a href="#" style="width: 36px; height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; display: grid; place-items: center">›</a>
          </span>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    var tints = ['#eef0ff', '#f1f5f9', '#fef3c7', '#dcfce7', '#fce7f3'];
    var raw = [
      ['Утасгүй чихэвч, ANC', 'ELEC-ANC-01', 'Цахилгаан бараа', '459,000₮', 23, true, true],
      ['Робот тоос сорогч', 'HOME-ROBO-02', 'Гэр ахуй', '1,290,000₮', 3, true, true],
      ['Бүтээлч барилгын блок, 1000ш', 'TOY-BLK-1000', 'Хүүхдийн тоглоом', '129,000₮', 34, true, false],
      ['55" 4K UHD Smart ТВ', 'ELEC-TV55-4K', 'Цахилгаан бараа', '2,190,000₮', 12, true, false],
      ['Эспрессо кофе машин', 'KIT-ESP-01', 'Гал тогоо', '890,000₮', 5, true, false],
      ['Иогийн дэвсгэр 6 мм', 'SPT-YOGA-6', 'Спорт, фитнес', '69,000₮', 88, true, false],
      ['Нүүрний чийгшүүлэгч крем', 'BTY-DEW-50', 'Гоо сайхан', '58,000₮', 0, false, false],
      ['Хүүхдийн тэрэг, 3 горим', 'BABY-STR-3', 'Нялх хүүхэд', '820,000₮', 9, true, false],
      ['Машины видео бичигч 4K', 'AUTO-CAM-4K', 'Авто хэрэгсэл', '239,000₮', 17, false, false],
      ['Тэжээвэр нохойн ор, M', 'PET-BED-M', 'Тэжээвэр амьтан', '89,000₮', 41, true, false]
    ];
    return {
      rows: raw.map(function (r, i) {
        var s = r[4];
        return { t: r[0], sku: r[1], cat: r[2], p: r[3], stock: s === 0 ? 'Дууссан' : s + ' ш',
          stockC: s === 0 ? '#b91c1c' : (s < 10 ? '#b45309' : '#0f172a'),
          on: r[5] ? 'true' : 'false', swBg: r[5] ? '#0000ff' : '#cbd5e1', swJ: r[5] ? 'flex-end' : 'flex-start',
          sel: r[6], rowBg: r[6] ? '#f8f9ff' : '#ffffff', tint: tints[i % 5] };
      })
    };
  }
}
</script>
</body>
</html>
